<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <title>Market Barkod Okuyucu</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --primary: #0b6b3a;
      --primary-dark: #084d29;
      --bg: #f5f7f6;
      --card: #ffffff;
      --text: #1c2a24;
      --muted: #5b6b63;
      --danger: #c0392b;
      --warn: #b8860b;
      --border: #e2e8e5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header {
      background: var(--primary); color: #fff; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header .brand { font-size: 12px; opacity: .85; }
    main { padding: 12px 14px 120px; max-width: 640px; margin: 0 auto; }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button {
      flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-weight: 600; font-size: 15px;
    }
    .tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .viewer {
      position: relative; width: 100%; aspect-ratio: 4/3; background: #000;
      border-radius: 14px; overflow: hidden; margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .viewer video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .viewer .frame {
      position: absolute; inset: 14% 8%; border: 2px solid rgba(255,255,255,.85);
      border-radius: 10px; pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.25);
    }
    .viewer .hint {
      position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
      color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .btn {
      padding: 11px 14px; border-radius: 10px; border: none; font-size: 14px;
      font-weight: 600; cursor: pointer; background: var(--primary); color: #fff;
    }
    .btn.secondary { background: #eef2f0; color: var(--text); border: 1px solid var(--border); }
    .btn.danger { background: var(--danger); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .manual { display: flex; gap: 8px; margin-bottom: 12px; }
    .manual input {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      font-size: 16px; background: #fff;
    }

    .card {
      background: var(--card); border-radius: 14px; padding: 14px;
      border: 1px solid var(--border); margin-bottom: 12px;
    }
    .card h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }

    .product-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
    .product-row:last-child { border-bottom: none; }
    .product-row .k { color: var(--muted); }
    .product-row .v { font-weight: 600; text-align: right; }
    .product-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .product-brand { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .price-tag { font-size: 22px; font-weight: 800; color: var(--primary); }

    .cart-list { list-style: none; margin: 0; padding: 0; }
    .cart-list li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .cart-list li:last-child { border-bottom: none; }
    .cart-list .name { font-weight: 600; }
    .cart-list .meta { color: var(--muted); font-size: 12px; }
    .cart-list .right { display: flex; align-items: center; gap: 10px; }
    .cart-list .price { font-weight: 700; color: var(--primary); }
    .cart-list .rm {
      background: #fbe9e7; color: var(--danger); border: none; border-radius: 8px;
      padding: 6px 8px; font-size: 12px; cursor: pointer;
    }

    .cart-summary {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: var(--primary-dark); color: #fff; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 -4px 16px rgba(0,0,0,.2);
    }
    .cart-summary .label { font-size: 12px; opacity: .85; }
    .cart-summary .total { font-size: 22px; font-weight: 800; }
    .cart-summary .count { font-size: 12px; opacity: .85; }

    .toast {
      position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
      background: rgba(20,20,20,.92); color: #fff; padding: 10px 16px;
      border-radius: 10px; font-size: 14px; z-index: 50; max-width: 90%;
      text-align: center; opacity: 0; transition: opacity .25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    .toast.warn { background: var(--warn); }

    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 14px 0; }

    .badge { display: inline-block; background: #eaf5ee; color: var(--primary); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; margin-left: 6px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">Marketim · Müşteri Uygulaması</div>
      <h1>Barkod Okuyucu</h1>
    </div>
    <div id="netStatus" class="brand">●</div>
  </header>

  <main>
    <div class="tabs" role="tablist">
      <button id="tabSingle" class="active" role="tab">Tekli Sorgu</button>
      <button id="tabCart" role="tab">Sepet Modu</button>
    </div>

    <div class="viewer" id="viewer">
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
      <div class="hint">Barkodu çerçeve içine hizalayın</div>
    </div>

    <div class="controls">
      <button id="btnStart" class="btn">Kamerayı Başlat</button>
      <button id="btnStop" class="btn secondary" disabled>Durdur</button>
      <button id="btnTorch" class="btn secondary hidden">Fener</button>
    </div>

    <div class="manual">
      <input id="manualInput" type="text" inputmode="numeric" placeholder="Barkod numarasını elle girin" />
      <button id="btnManual" class="btn secondary">Sorgula</button>
    </div>

    <!-- Tekli mod -->
    <section id="singleView">
      <div class="card" id="singleCard">
        <h2>Ürün Bilgisi</h2>
        <div id="singleContent" class="empty">Henüz bir barkod okutulmadı.</div>
      </div>
    </section>

    <!-- Sepet modu -->
    <section id="cartView" class="hidden">
      <div class="card">
        <h2>Sepetteki Ürünler <span class="badge" id="cartBadge">0</span></h2>
        <ul id="cartList" class="cart-list">
          <li class="empty" id="cartEmpty">Sepet boş. Ürünleri okutun.</li>
        </ul>
      </div>
      <button id="btnClearCart" class="btn danger" style="width:100%">Sepeti Temizle</button>
    </section>
  </main>

  <div class="cart-summary hidden" id="cartSummary">
    <div>
      <div class="label">Toplam</div>
      <div class="total" id="cartTotal">0,00 ₺</div>
    </div>
    <div class="count" id="cartCount">0 ürün</div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
